name: Take screenshots (one-time)
on:
  push:
    paths: ['.github/workflows/comic-shots.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  shots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Take screenshots on a real MagicMirror
        run: |
          git clone --depth 1 https://github.com/MagicMirrorOrg/MagicMirror "$RUNNER_TEMP/mm"
          cd "$RUNNER_TEMP/mm"
          npm install --omit=dev --no-audit --no-fund --ignore-scripts
          mkdir -p modules/MMM-Comic
          cp "$GITHUB_WORKSPACE"/MMM-Comic.js "$GITHUB_WORKSPACE"/MMM-Comic.css "$GITHUB_WORKSPACE"/node_helper.js modules/MMM-Comic/
          cat > config/config.js <<'CFG'
          let config = {
            address: "localhost", port: 8080, ipWhitelist: [], language: "en", timeFormat: 12,
            modules: [
              { module: "MMM-Comic", position: "top_center", config: { type: "calvin" } },
              { module: "MMM-Comic", position: "bottom_center", config: { type: "frazz" } }
            ]
          };
          if (typeof module !== "undefined") { module.exports = config; }
          CFG
          (node --run server > /tmp/mm.log 2>&1 &)
          for i in $(seq 1 30); do curl -s -o /dev/null http://localhost:8080/ && break; sleep 2; done
          pip install -q playwright
          python3 - <<'PY'
          import asyncio, os
          from playwright.async_api import async_playwright
          out = os.path.join(os.environ["GITHUB_WORKSPACE"], "examples")
          os.makedirs(out, exist_ok=True)
          async def main():
              async with async_playwright() as p:
                  b = await p.chromium.launch(executable_path="/usr/bin/google-chrome")
                  pg = await b.new_page(viewport={"width": 1920, "height": 1400})
                  await pg.goto("http://localhost:8080/")
                  await pg.wait_for_function("[...document.querySelectorAll('.MMM-Comic img')].filter(i => i.complete && i.naturalWidth > 0).length === 2", timeout=90000)
                  await pg.wait_for_timeout(2500)
                  mods = await pg.query_selector_all(".MMM-Comic .comic")
                  for name, m in zip(["calvin", "frazz"], mods):
                      await m.screenshot(path=os.path.join(out, name + ".png"))
                  await b.close()
          asyncio.run(main())
          PY
          grep -i comic /tmp/mm.log || true
          ls -la "$GITHUB_WORKSPACE/examples"
      - name: Commit
        run: |
          git config user.name "cowboysdude"
          git config user.email "cowboysdude@users.noreply.github.com"
          git add examples
          git commit -m "Add screenshots"
          git push
